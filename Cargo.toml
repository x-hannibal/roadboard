[workspace]
members  = ["crates/*", "tools/*"]
resolver = "2"

[workspace.package]
version      = "0.0.1"
edition      = "2021"
rust-version = "1.82"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (ready for M1 — only roadboard-storage links against it)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# robot CLI
clap      = { version = "4", features = ["derive"] }
toml_edit = "0.22"
regex     = "1"
tempfile  = "3"
chrono    = { version = "0.4", features = ["serde"] }

# Identity / auth
uuid      = { version = "1", features = ["v7"] }
argon2    = { version = "0.5", features = ["std"] }
sha2      = "0.10"
rand      = "0.8"
hex       = "0.4"

# Session management — sqlx-store 0.15 uses tower-sessions-core 0.14, so pin tower-sessions to 0.14
tower-sessions            = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
time                      = "0.3"

# HTTP utilities (service testing)
tower  = { version = "0.5", features = ["util"] }

# Encoding
base64 = "0.22"

[workspace.lints.rust]
unsafe_code       = "forbid"
async_fn_in_trait = "allow"

[workspace.lints.clippy]
all = "warn"
